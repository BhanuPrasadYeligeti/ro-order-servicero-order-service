_schema-version: "3.1"
ID: ro-order-fullstack
version: 1.0.0
description: Sales order app - SAPUI5 front end + CAP Node.js backend + approuter (BTP CF trial, no HANA)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        # The build image may run an old Node.js (e.g. Piper's mbtci-java11-node16), but @sap/cds 9 needs Node >= 20:
        # install without native builds, then run "cds build" with a Node 22 binary fetched from npm.
        - npm install --ignore-scripts
        - npx -y -p node@22 node node_modules/@sap/cds-dk/bin/cds.js build --production
        # copy SAP repository auth (.npmrc) so CF staging can download the Cloud ALM agent
        - cp .npmrc gen/srv/.npmrc

modules:
  # Backend: CAP Node.js OData V4 service (in-memory SQLite, demo data loaded at start)
  - name: ro-order-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      # no npm install in the build container: Cloud Foundry installs the dependencies during staging (Node 22)
      builder: custom
      commands: []
      ignore: [".env", "node_modules/"]
    properties:
      SAP_CALM_SERVICE_NAME: ro-order-srv     # app name shown in SAP Cloud ALM
      SAP_CALM_SERVICE_TYPE: SAP_CP_CF        # SAP BTP, Cloud Foundry environment
      NODE_ARGS: -r @sap/xotel-agent-ext-js   # preload the SAP Cloud ALM agent (start script: node ${NODE_ARGS} ./node_modules/.bin/cds-serve)
      SAP_CALM_LOGS_ENABLED: true             # agent forwards the app's runtime log records (cds.log) to SAP Cloud ALM
      # Trial workaround: push warnings/errors to the service created manually in Cloud ALM (srv/calm-push.js)
      SAP_CALM_PUSH_ENABLED: true
      SAP_CALM_PUSH_SERVICE_ID: ""            # <- LMS ID of the ro-order-srv service in Cloud ALM Landscape Management
      SAP_CALM_PUSH_DESTINATION: CALM_datacollector
      SAP_CALM_PUSH_USE_CASE: exm.im          # Integration & Exception Monitoring -> Exceptions
      SAP_CALM_PUSH_DEV: true                 # first tests: synchronous, returns error details (max 100 calls/24h); set false afterwards
      SAP_CALM_PUSH_INTERVAL: 300             # seconds between pushes (only when there is something to send)
    requires:
      - name: ro-order-destination            # lets the Cloud ALM agent read destination CALM_datacollector
      - name: ro-order-logs                   # Application Logging service -> logs in the Application Logging Dashboard
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # Front end: SAPUI5 app served by the SAP Application Router, which forwards /odata to the backend
  - name: ro-order-app
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    build-parameters:
      # no npm install in the build container: Cloud Foundry installs the approuter during staging (Node 22)
      builder: custom
      commands: []
      ignore: ["node_modules/"]
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: false
      - name: ro-order-logs # Application Logging service (approuter / RTR request logs)

resources:
  # Destination service instance (plan lite, free on trial). The SAP Cloud ALM agent uses it to read
  # the subaccount destination CALM_datacollector (Cloud ALM API URL + OAuth client credentials).
  - name: ro-order-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # Application Logging service (plan lite). Binding it to both apps sends their logs to the Application Logging Dashboard.
  - name: ro-order-logs
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
